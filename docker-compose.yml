# One service, one machine, no orchestration. `./deploy.sh` drives this file.

services:
  ostrich-view:
    build: .
    image: ostrich-view:latest
    container_name: ostrich-view

    # NC_BASE_URL, NC_USER, NC_APP_PASSWORD, SESSION_SECRET (see .env.example).
    # The file must exist -- compose errors out rather than starting a
    # half-configured container, which is the behaviour we want.
    env_file: .env

    environment:
      # Stated here as well as in the Dockerfile so it wins over anything an
      # older .env might have set: `production` is what makes the session
      # cookie Secure-only and turns on template caching.
      NODE_ENV: production

    # Bound to loopback only -- for local debugging (curl on the host, or
    # `ssh -L 3000:127.0.0.1:3000`). Real traffic does not use this mapping.
    #
    # NOTE: if cloudflared runs as a *container* rather than on the host, it
    # cannot reach this at all -- 127.0.0.1 inside that container is the
    # container itself, not the host. That is the case on the Beelink, where
    # Caddy fronts the app over the shared `proxy` network instead. See the
    # networks block below.
    #
    # The container side follows PORT from .env (compose interpolates it), so
    # changing PORT needs no edit here.
    ports:
      - "127.0.0.1:3000:${PORT:-3000}"

    volumes:
      # Runtime state: preview-cache/ and state.json. Survives restarts and
      # rebuilds; deleting it only costs a cold preview cache and everyone's
      # "new since you last looked" baseline.
      - ./data:/app/data
      # Read-only: the app only ever reads viewers.json, and a container that
      # cannot rewrite its own auth config is one less thing to think about.
      - ./config:/app/config:ro

    restart: unless-stopped

    # --- Docker networks -----------------------------------------------------
    # Two shared networks, both created and owned by other compose projects on
    # this host, so both are declared `external: true` below -- we join them,
    # we do not manage them.
    #
    #   proxy          Caddy's network. Caddy reverse-proxies to
    #                  ostrich-view:3000 for both the public hostname (via the
    #                  Cloudflare tunnel) and direct LAN access. This is how
    #                  traffic actually arrives.
    #
    #   nextcloud-aio  Nextcloud AIO's network. Lets NC_BASE_URL be the
    #                  Nextcloud container name so preview and file traffic
    #                  stays on the docker bridge instead of going out to
    #                  Cloudflare and back:
    #                      NC_BASE_URL=http://nextcloud-aio-apache:11000
    #                  Nextcloud checks the Host header, so that hostname must
    #                  also be in its trusted_domains -- see the runbook in
    #                  homelab-beelink-setup.
    networks:
      - proxy
      - nextcloud-aio

networks:
  proxy:
    external: true
  nextcloud-aio:
    external: true
